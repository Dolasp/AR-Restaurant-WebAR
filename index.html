<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AR Restaurant Menu</title>

    <!-- Google Model Viewer -->
    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
        }

        h1 {
            margin: 0;
        }

        .menu-card {
            background: white;
            margin: 20px auto;
            padding: 20px;
            max-width: 500px;
            border-radius: 15px;
        }

        model-viewer {
            width: 100%;
            height: 400px;
            background: #eeeeee;
            border-radius: 12px;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            margin: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>AR Restaurant</h1>
        <p>Explore your food in Augmented Reality</p>
    </header>

    <div class="menu-card">

        <h2>🍕 Pizza</h2>

        <p>Freshly baked cheesy pizza</p>

        <div class="price">₹249</div>

        <model-viewer
            src="pizza.glb"
            alt="3D model of Pizza"
            ar
            ar-modes="scene-viewer webxr quick-look"
            camera-controls
            auto-rotate
            shadow-intensity="1">
        </model-viewer>

        <p>
            Rotate the pizza or tap the AR button
            to place it in your surroundings.
        </p>

    </div>

</body>

</html>
